import os

if 'emscripten' not in config.available_features or 'node' not in config.available_features:
    config.unsupported = True

runtime_src = os.path.join(config.rlc_root_dir, 'lib', 'runtime', 'src', 'Runtime.c')
rlc_include = os.path.join(config.rlc_root_dir, 'lib', 'runtime', 'include')
rlc_stdlib = os.path.join(config.rlc_root_dir, 'stdlib')

def make_wasm_pipeline(rlc_target, js_flag, extra_emcc_flags=""):
    return (
        'split-file %s %t && '
        f'rlc %t/main.rl -i {rlc_stdlib} --target={rlc_target} -o %t/outputRlc.o --compile && '
        f'emcc {runtime_src} -I {rlc_include} -c -o %t/runtime.o {extra_emcc_flags} && '
        f'rlc %t/main.rl -i {rlc_stdlib} {js_flag} -o %t/wrapper.mjs && '
        f'emcc -o %t/glueCode.mjs %t/outputRlc.o %t/runtime.o '
        '-fsanitize=address -g -fno-omit-frame-pointer '
        '-Wl,--no-gc-sections -Wl,--export-all -Wl,--export-dynamic --no-entry '
        '-s "EXPORTED_RUNTIME_METHODS=[\'setValue\', \'getValue\', \'stringToNewUTF8\', \'UTF8ToString\', \'HEAP8\', \'stackSave\', \'stackAlloc\', \'stackRestore\']" '
        f'-s EXPORT_ALL=1 -s MODULARIZE {extra_emcc_flags} && '
        'node %t/test.mjs'
    )

config.substitutions.append(('%run_wasm32_test', make_wasm_pipeline('wasm32-unknown-emscripten', '--javascript32')))
config.substitutions.append(('%run_wasm64_test', make_wasm_pipeline('wasm64-unknown-emscripten', '--javascript64', '-m64')))